[package]
name = "atv-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atv-core = { path = "../atv-core" }
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
once_cell = "1.19"
